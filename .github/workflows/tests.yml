name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test && npm run check
      - run: curl --fail --silent --show-error https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.81.1/dist/umd/supabase.js -o /tmp/supabase-sdk.js && node --check /tmp/supabase-sdk.js
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.5.6
      - run: deno check --config=supabase/functions/strava/deno.json --lock=supabase/functions/strava/deno.lock supabase/functions/strava/index.ts
      - name: Export dependency lock
        run: node -e "console.log('DENO_LOCK='+JSON.stringify(JSON.parse(require('fs').readFileSync('supabase/functions/strava/deno.lock','utf8'))))"
      - run: node tests/browser-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-test-results
          path: test-results/
